# hyprpaper configuration
#
# Rewritten 2026-09-02: hyprpaper dropped the old flat syntax
#   preload   = <path>
#   wallpaper = <monitor>,<path>
# Wallpapers are now anonymous `wallpaper { }` categories, and `preload` no
# longer exists. The old keys are silently ignored, which shows up as
# "Monitor <name> has no target: no wp will be created" in hyprpaper --verbose.

# Fallback for every monitor (empty `monitor` = any output without its own rule)
wallpaper {
    monitor  =
    path     = ~/Pictures/Wallpapers/25562.jpg
    fit_mode = cover
}

# Per-monitor override example:
# wallpaper {
#     monitor  = eDP-1
#     path     = ~/Pictures/Wallpapers/wallpaper-4k-for-pc--heroscreen.cc.png
#     fit_mode = cover
# }

# Rotate through a directory instead of a single image:
# wallpaper {
#     monitor  =
#     path     = ~/Pictures/Wallpapers
#     fit_mode = cover
#     timeout  = 900
#     order    = random
# }

# Hide the Hyprland splash text drawn over the wallpaper (defaults to true)
splash = false
