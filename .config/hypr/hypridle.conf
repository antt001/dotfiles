general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    # Delay the wake-up modeset so the dock's DisplayPort-MST hub has re-trained
    # before the first commit. Belt-and-braces: the real cause of externals
    # vanishing after resume is aquamarine 0.15.0 leaking CRTCs of removed
    # connectors (hyprwm/aquamarine#386). Recovery: Ctrl+Alt+F3, then back.
    after_sleep_cmd = sleep 3 && hyprctl dispatch dpms on
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600                                # 10min (600 s -- the old comment said 30)
    # Suspend only on battery. When docked (AC present) stay awake: a dock that
    # drops during s2idle triggers the aquamarine CRTC-leak bug above and the
    # externals come back dead. Lock + DPMS-off still apply, so idle on the
    # dock costs only power, not the displays.
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 1 ] || systemctl suspend
}
